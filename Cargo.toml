[package]
name = "state_search_engine"
version = "0.1.0"
edition = "2021"
authors = ["Prabhav Dwivedi <prabhavdwiwedi32@gmail.com>"]
description = "High-performance cache-resident discrete state-space search engine in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prabhav-dev/state-space-search-engine"
readme = "README.md"

[dependencies]
rayon = "1.8"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "pointer_chase"
harness = false

[[bench]]
name = "traversal_bench"
harness = false